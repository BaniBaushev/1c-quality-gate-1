name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Целостность пакета
        run: node tools/validate-package.mjs

      - name: Синтаксис валидаторов XML
        run: python -m compileall -q tools/xml

      - name: Производная карта признаков синхронна с источником
        run: |
          node tools/gen-signs-map-md.mjs
          git diff --exit-code skills/bsl-architecture-review/references/signs-map.md \
            || { echo "signs-map.md устарел — перегенерируй: node tools/gen-signs-map-md.mjs"; exit 1; }

      - name: Тесты программных проверок
        run: node tests/run-tests.mjs
