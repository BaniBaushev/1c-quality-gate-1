# Гейтовый конфиг bsl-analyzer.
#
# Проектный `bsl-analyzer.toml` продолжает править IDE, этот правит гейтом. Разделение
# намеренное: пороги проекта принадлежат проекту, но гейт не может от них зависеть — иначе
# отключённая в проекте диагностика делает гейт тише, и об этом никто не узнает.
#
# Отключено ровно то, что не влияет на поведение кода: форматирование и типографика.
# Причина не в том, что это неважно, а в том, что на одном модуле типового кода такие
# замечания дают сотни строк и топят содержательные находки. Гигиену файлов у нас закрывает
# отдельный контур (`file-hygiene`), а не статический анализатор.
#
# Вернуть любое правило можно в проектном конфиге — он накладывается поверх.

[diagnostics.parameters]
LineLength = false
MissingSpace = false
SpaceAtStartComment = false
ConsecutiveEmptyLines = false
IncorrectLineBreak = false
SemicolonPresence = false
YoLetterUsage = false
Typo = false
